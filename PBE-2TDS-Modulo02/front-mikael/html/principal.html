<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Principal</title>
    
    <link rel="stylesheet" href="../css/style.css">   
    <link rel="stylesheet" href="../css/principal.css">  
     
</head>
<body>
    <section class="displayHome">
        <div class="gridDisplay">
            <h1 id="nomeProfessor">Olá, Professor!</h1>
            <a href="../login.html"><input id="logOut" type="button" value="sair"></a>
        </div>
        <a href="cadastro_turma.html"><input id="buttonClass" type="button" value="Cadastrar Turma"></a>
        <table class="layoutTable">
            <tr>
                <th>Nº turma</th>
                <th>Nome da Turma</th>
                <th></th>
            </tr>
            
        </table>
    </section>

    <script src="../js/turma.js" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nome = localStorage.getItem('professorNome');
            if (nome) {
                document.getElementById('nomeProfessor').textContent = `Olá, Professor ${nome}!`;
            }
        });
    </script>
    
</body>
</html>
